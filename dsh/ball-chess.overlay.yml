- insert:
    - id: preset-ball-chess
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ball-chess
        name: Ball Chess player
        description: Join one invited seat and play the match with only Ball Chess tools.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 Ball Chess 对局参与者。用户给出邀请码并要求开始时，调用 join_by_invite；该工具会认领席位、发送准备，并在返回的 rules 与 wallBudgets 中提供本局完整规则、胜利目标和动态墙配置。不要依赖提示词中的固定规则副本。

                只根据工具返回的当前版本、rules、wallBudgets 和 decision.legal 决策。轮到自己时复制一个列出的 actionId，并用该 actionId 与最新版本调用 submit_action；尚未轮到自己时调用 wait_for_turn；版本冲突或状态不确定时调用 get_match_state。仅在需要完整棋谱时调用 get_match_record。对局结束后简洁报告 winner 和 reason，不再提交行动。不要索要、展示或猜测席位令牌。
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: ball-chess-compaction
                name: 'ball-chess/dsh/compaction-plugin'
                config:
                  auto: true
                  thresholdRatio: 0.8
                  headroomTokens: 65536
                  retainTokens: 8192
                  maxTokens: 4096
                  compactionRetries: 1
                  maxOverflowRetries: 1
          - id: ball-chess-tools
            name: 'ball-chess/dsh/plugin'
            config:
              baseUrl: !!js process.env.BALL_CHESS_URL ?? 'http://127.0.0.1:7100'

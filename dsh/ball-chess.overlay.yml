- insert:
    - id: preset-ball-chess
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ball-chess
        name: Ball Chess player
        description: Join one invited seat and play the match with only Ball Chess tools.
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 Ball Chess 对局参与者。棋盘为 9×13，左方从 (2,0)、右方从 (6,0) 出发，任一方先到达 y=12 获胜。每回合只能正交移动一格或放置一堵覆盖两条边的墙；不能斜走、跳过或进入对方格子，也不能跳过回合。墙不得重叠或相交，并且必须始终为双方保留至少一条通往目标行的路径。

                用户给出邀请码并要求开始时，调用 join_by_invite；该工具会认领席位并发送准备。只根据工具返回的当前版本和合法行动决策。本局的墙数量、双方剩余墙数、先手、最大手数和回合时限必须以本局工具返回为准，不得采用固定默认值。轮到自己时提交一个列出的合法行动；尚未轮到自己时调用 wait_for_turn；版本冲突或状态不确定时调用 get_match_state。对局结束后简洁报告 winner 和 reason，不再提交行动。不要索要、展示或猜测席位令牌。
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: ball-chess-compaction
                name: './compaction-plugin.js'
                config:
                  auto: true
                  thresholdRatio: 0.8
                  headroomTokens: 65536
                  retainTokens: 8192
                  maxTokens: 4096
                  compactionRetries: 1
                  maxOverflowRetries: 1
          - id: ball-chess-tools
            name: './plugin.js'
            config:
              baseUrl: !!js process.env.BALL_CHESS_URL ?? 'http://127.0.0.1:7100'

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ball Chess · 放墙竞速</title>
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">BALL / CHESS</p>
        <h1>向前一步，或改变路径。</h1>
        <p class="subtitle">9 × 13 双人放墙竞速 · 本地对局 · Agent 就绪</p>
      </div>
      <div class="header-badge"><span class="pulse" aria-hidden="true"></span>LOCAL MATCH</div>
    </header>

    <section class="match-strip" aria-label="当前对局">
      <div><span class="label">MATCH</span><output id="match-id">尚未创建</output></div>
      <p id="status" aria-live="polite">创建或加入一局，开始对弈。</p>
      <p id="countdown">回合不限时</p>
    </section>

    <div class="game-layout">
      <section class="board-panel" aria-label="游戏棋盘与行动">
        <div class="player-row" aria-label="双方状态">
          <div class="player-chip" id="left-status"><span class="player-dot red" aria-hidden="true"></span><span>左侧 · 红球</span><strong id="left-walls">∞</strong></div>
          <div class="player-chip" id="right-status"><span class="player-dot blue" aria-hidden="true"></span><span>右侧 · 蓝球</span><strong id="right-walls">∞</strong></div>
        </div>
        <div id="board" class="board"></div>
        <div class="action-toolbar" aria-label="行动方式">
          <div class="segmented" role="group" aria-label="行动类型">
            <button id="mode-move" type="button" class="active" disabled>移动一球</button>
            <button id="mode-wall" type="button" disabled>放置挡板</button>
          </div>
          <label class="orientation-label" for="wall-orientation">方向
            <select id="wall-orientation">
              <option value="h">横向</option>
              <option value="v">竖向</option>
            </select>
          </label>
        </div>
        <p class="board-hint">先到顶边任意格即获胜。墙覆盖两条格边，不可重叠或十字交叉。</p>
        <div id="result" class="result" role="status"></div>
        <div id="error" class="error" role="alert"></div>
      </section>

      <aside id="sidebar" class="sidebar">
        <section class="panel-section">
          <div class="section-heading"><span>01</span><h2>新建对局</h2></div>
          <form id="create-form">
            <label>我的席位
              <select id="seat">
                <option value="left">左侧 · 红球</option>
                <option value="right">右侧 · 蓝球</option>
                <option value="spectate">仅观战</option>
              </select>
            </label>
            <div class="field-pair">
              <label>墙体规则
                <select id="wall-mode">
                  <option value="unlimited">无限墙</option>
                  <option value="finite">有限墙</option>
                </select>
              </label>
              <label>每方数量
                <input id="wall-limit" type="number" min="0" step="1" value="10" disabled>
              </label>
            </div>
            <div class="field-pair">
              <label>最大行动数
                <input id="max-plies" type="number" min="1" step="1" value="300" required>
              </label>
              <label>回合超时（秒）
                <input id="turn-timeout" type="number" min="1" step="1" placeholder="不限时">
              </label>
            </div>
            <label>先手
              <select id="first-player">
                <option value="left">左侧先手</option>
                <option value="right">右侧先手</option>
                <option value="random">随机先手</option>
              </select>
            </label>
            <button class="primary" type="submit">创建本地对局</button>
          </form>
        </section>

        <section class="panel-section">
          <div class="section-heading"><span>02</span><h2>加入或观战</h2></div>
          <form id="join-form">
            <label>对局 ID<input id="join-id" autocomplete="off" placeholder="m_…" required></label>
            <label>席位令牌（留空则观战）<input id="join-token" type="password" autocomplete="off" placeholder="仅粘贴你的玩家令牌"></label>
            <button type="submit">加入对局</button>
          </form>
        </section>

        <section class="panel-section compact-section">
          <div class="section-heading"><span>03</span><h2>棋谱与接入</h2></div>
          <div id="action-log" class="action-log">尚未行动</div>
          <div id="agent-setup" hidden>
            <label>Agent 席位
              <select id="agent-seat"><option value="left">左侧 Agent</option><option value="right">右侧 Agent</option></select>
            </label>
            <pre id="mcp-config" class="code-block"></pre>
            <button id="copy-mcp" type="button">复制 MCP 配置</button>
            <pre id="agent-prompt" class="code-block prompt-block"></pre>
            <button id="copy-prompt" type="button">复制席位提示词</button>
            <button id="abort-match" type="button" class="danger">中止此对局</button>
          </div>
        </section>
      </aside>
    </div>
  </main>
  <noscript>此游戏需要启用 JavaScript。</noscript>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
